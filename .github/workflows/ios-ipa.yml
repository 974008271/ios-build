name: Build unsigned iOS IPAs

on:
  workflow_dispatch:
    inputs:
      build_dshgo:
        description: '构建 DSH Go'
        type: boolean
        default: true
      build_dshios:
        description: '构建 DSHIOS（需 Xcode 27 runner，通常要付费 larger runner）'
        type: boolean
        default: false
      skip_engine:
        description: '跳过准备本机引擎（首次卡在 prepare-engine 时勾上；包将只能连远程主机）'
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  dsh-go:
    if: ${{ github.event_name == 'push' || inputs.build_dshgo }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: 拉取 DSH Go 源码
        uses: actions/checkout@v4
        with:
          repository: ccch1mneyyy/dsh-Go
          ref: main

      - name: 安装 Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: 准备本机引擎
        if: ${{ github.event_name == 'push' || !inputs.skip_engine }}
        run: bash tooling/ios/prepare-engine.sh

      - name: 拉取 Dart 依赖
        run: cd app && flutter pub get

      - name: 编译未签名 Release
        run: cd app && bash ../tooling/ios/build.sh --release --no-codesign

      - name: 打包成 ipa
        run: |
          APP=$(find app/build/ios -maxdepth 5 -type d -name 'Runner.app' -print -quit)
          test -n "$APP" || { echo "Runner.app not found"; exit 1; }
          mkdir -p stage/Payload
          cp -R "$APP" stage/Payload/
          (cd stage && zip -qry "$GITHUB_WORKSPACE/DSH-Go-unsigned.ipa" Payload)

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Go-unsigned-ipa
          path: DSH-Go-unsigned.ipa
          retention-days: 14

  dshios:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_dshios }}
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: 拉取 DSHIOS 源码
        uses: actions/checkout@v4
        with:
          repository: everettjf/dsh-ios
          ref: main

      - name: 安装构建工具
        run: |
          brew install meson ninja lld llvm
          gem install xcodeproj
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: 编译模拟器 CLI + 根文件系统 + Xcode 工程
        run: |
          export PATH="$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:$PATH"
          make emulator
          make rootfs
          make project

      - name: 编译未签名 DSH.app
        run: |
          xcodebuild -project DSH.xcodeproj -scheme DSH -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: 打包成 ipa
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/DSH.app
          test -d "$APP" || { echo "DSH.app not found"; exit 1; }
          mkdir -p stage/Payload
          cp -R "$APP" stage/Payload/
          (cd stage && zip -qry "$GITHUB_WORKSPACE/DSHIOS-unsigned.ipa" Payload)

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DSHIOS-unsigned-ipa
          path: DSHIOS-unsigned.ipa
          retention-days: 14
